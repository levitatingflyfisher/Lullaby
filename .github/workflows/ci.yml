# Release workflow intentionally omitted — applicationId is still com.example.lullaby.
# Add release.yml once applicationId is updated to a published identifier.

name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: Lullaby

      - name: Clone the sibling path-dep packages
        # Lullaby depends on these by sibling path (../packages/... and
        # ../ohStyle/... relative to the Lullaby checkout above), matching the
        # local monorepo layout. They are published as their own public repos;
        # clone them where pubspec.yaml expects. sanctuary_backup_ui itself
        # depends on sanctuary_auth_core by the same sibling path, so both must
        # sit under packages/.
        run: |
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryAuthCore packages/sanctuary_auth_core
          git clone --depth 1 https://github.com/levitatingflyfisher/sanctuaryBackupUi packages/sanctuary_backup_ui
          git clone --depth 1 https://github.com/levitatingflyfisher/ohStyle ohStyle
          git clone --depth 1 https://github.com/levitatingflyfisher/ohFleetConformance packages/oh_fleet_conformance
          # Two-phone sync's kernel (ADR-0007), by sibling path ../hearthSync.
          git clone --depth 1 https://github.com/levitatingflyfisher/hearthSync hearthSync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Must bundle Dart >= 3.10.7 to satisfy pubspec's `environment: sdk`.
          # 3.29.x shipped Dart 3.7.2 and failed version resolution.
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: Lullaby
        run: flutter pub get

      - name: Generate code (build_runner / drift)
        working-directory: Lullaby
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: Lullaby
        run: flutter analyze

      # C3: the gz-JS size budget only bites when build/web exists
      - name: Build web (C3 budget artifact)
        working-directory: Lullaby
        run: flutter build web --release
      - uses: dtolnay/rust-toolchain@stable

      # test/sync runs two phones through the real relay: build the host
      # kernel bridge and the relay binary from the hearthSync checkout.
      - name: Build the sync kernel bridge and relay
        working-directory: hearthSync
        run: |
          (cd flutter/hearth_sync/rust && CARGO_TARGET_DIR=$PWD/target cargo build --release)
          CARGO_TARGET_DIR=$PWD/target cargo build --release -p hearth_sync_relay

      - name: Run tests
        working-directory: Lullaby
        # A real DST timezone, not the runner's UTC: calendar-age maths
        # (growth percentiles, the age label) can only be told apart from
        # Duration maths when local midnights shift twice a year. It is
        # also the zone the goldens are baked in.
        env:
          TZ: America/Denver
        run: flutter test
